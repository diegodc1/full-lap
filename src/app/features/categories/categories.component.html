<div class="d-flex w-100 align-items-start">
    <div class="category-container w-100">
        <div class="d-flex flex-column gap-2 w-100">
            <h1 class="category-title">{{nameCategorySelected}}</h1>
            <span>Acompanhe todo o calendário da {{nameCategorySelected}} - {{selectedSeasonYear}}</span>
            <span class="message-changes">*Datas, horários e locais sujeitos a alterações</span>
        </div>
        
        <div class="content-layout d-flex gap-4 w-100 mt-4">
            <div class="races-section flex-grow-1">
                <app-category-content [categoryKey]="selectedCategory" (seasonYearChange)="onSeasonYearChange($event)"></app-category-content>
            </div>
            
            <div class="infos-section">
                <app-driver-standings [categoryKey]="selectedCategory" [seasonYear]="selectedSeasonYear"></app-driver-standings>
                <div class="news-box">
                    <div class="news-box">
                        <app-news-card
                            *ngFor="let news of newsList"
                            [title]="news.title"
                            [description]="news.summary"
                            [imageUrl]="news.imageUrl"
                            [readMoreLink]="news.link"
                            [category]="nameCategorySelected"
                            [source]="news.source"
                            [newsUrl]="news.link">
                        </app-news-card>
                </div>
            </div>
        </div>
    </div>
</div>
